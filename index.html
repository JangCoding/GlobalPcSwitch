<input type="text" id="uuid_input" placeholder="UUID를 입력하세요">

<script>
  window.onload = function() {
    // 1. URL 파라미터 확인
    const params = new URLSearchParams(window.location.search);
    const uuid = params.get('uuid');
    
    // 2. 파라미터가 있다면 자동 입력
    if (uuid) {
      document.getElementById('uuid_input').value = uuid;
    } else {
      // 3. 파라미터가 없다면 클립보드 붙여넣기 안내
      navigator.clipboard.readText().then(text => {
        if(confirm("복사된 UUID를 자동으로 입력할까요?")) {
          document.getElementById('uuid_input').value = text;
        }
      });
    }
  };
</script>
