<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Grid Console</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { background-color: #0c0c0e; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 30px 15px; }
        .wrapper { max-width: 480px; margin: 0 auto; }
        h1 { font-size: 24px; color: #00e676; text-align: center; margin-bottom: 25px; }
        
        .add-box { background: #16161a; padding: 20px; border-radius: 16px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #222227; border: 1px solid #33333d; border-radius: 8px; color: #fff; box-sizing: border-box; }
        
        /* Disable 스타일: 비활성 버튼 */
        .btn-add { width: 100%; padding: 12px; background: #00b0ff; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-add:disabled { background: #333; color: #777; cursor: not-allowed; }

        .device-card { background: #1c1c22; border-radius: 16px; padding: 20px; margin-bottom: 15px; border-left: 5px solid #00e676; position: relative; }
        .device-name { font-size: 18px; font-weight: bold; }
        .device-uuid { font-size: 11px; color: #555; font-family: monospace; margin-bottom: 10px; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px; }
        .btn-pwr { background: #27ae60; }
        .btn-frc { background: #c0392b; }
        .btn-edit { background: #555; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Universal Grid Console</h1>
    
    <div class="add-box">
        <h3>+ 새 기기 등록</h3>
        <input type="text" id="new-name" placeholder="기기 별명" oninput="validateForm()">
        <input type="text" id="new-uuid" placeholder="기기 UUID" oninput="validateForm()">
        <button id="add-btn" class="btn-add" onclick="addDevice()" disabled>제어망에 등록</button>
    </div>

    <div id="device-list"></div>
</div>

<script>
    const client = mqtt.connect("wss://broker.hivemq.com:8000/mqtt");
    let devices = JSON.parse(localStorage.getItem('global_grid_devices') || "[]");

    // [피드백 반영] 입력값 체크하여 버튼 활성/비활성화
    function validateForm() {
        const name = document.getElementById('new-name').value;
        const uuid = document.getElementById('new-uuid').value;
        document.getElementById('add-btn').disabled = !(name && uuid);
    }

    function addDevice() {
        const name = document.getElementById('new-name').value;
        const uuid = document.getElementById('new-uuid').value;
        devices.push({ name, uuid });
        saveAndRender();
        document.getElementById('new-name').value = "";
        document.getElementById('new-uuid').value = "";
        validateForm();
    }

    // [피드백 반영] 수정 기능: prompt로 간단히 별명/UUID 변경
    function editDevice(index) {
        const d = devices[index];
        const newName = prompt("새 별명을 입력하세요:", d.name);
        const newUuid = prompt("새 UUID를 입력하세요:", d.uuid);
        if (newName && newUuid) {
            devices[index] = { name: newName, uuid: newUuid };
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('global_grid_devices', JSON.stringify(devices));
        renderDevices();
    }

    function renderDevices() {
        const listDiv = document.getElementById('device-list');
        listDiv.innerHTML = devices.map((d, i) => `
            <div class="device-card">
                <div class="device-name">${d.name}</div>
                <div class="device-uuid">${d.uuid}</div>
                <div class="btn-group">
                    <button class="btn-action btn-pwr" onclick="publish('${d.uuid}', 500)">부팅</button>
                    <button class="btn-action btn-frc" onclick="publish('${d.uuid}', 5000)">강제종료</button>
                    <button class="btn-action btn-edit" onclick="editDevice(${i})">수정</button>
                </div>
            </div>
        `).join('');
    }

    function publish(topic, dur) {
        client.publish(topic, JSON.stringify({action: "relay", duration: dur}));
    }

    renderDevices();
</script>
</body>
</html>
