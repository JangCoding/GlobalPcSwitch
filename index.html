<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal PC Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background:#121212; color:#fff; font-family:sans-serif; text-align:center; padding:20px; }
        .container { max-width:400px; margin:0 auto; background:#1e1e1e; padding:25px; border-radius:20px; }
        input { width:100%; padding:12px; margin:10px 0; background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:8px; box-sizing:border-box; }
        button { width:100%; padding:15px; margin:10px 0; border:none; border-radius:12px; font-weight:bold; cursor:pointer; color:white; background:linear-gradient(135deg, #00b0ff, #00e676); }
    </style>
</head>
<body>
    <div class="container">
        <h2>PC 제어 콘솔</h2>
        <input type="text" id="uuid_input" placeholder="기기 UUID 입력">
        <button onclick="sendPowerCommand()">전원 버튼 (Toggle)</button>
        <p id="status">MQTT 연결 대기 중...</p>
    </div>

    <script>
        // 1. MQTT 설정 (HiveMQ 공용 브로커)
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, "web_client_" + Math.random());
        client.onConnectionLost = (e) => { document.getElementById('status').innerText = "연결 끊김"; };
        client.connect({onSuccess: () => { document.getElementById('status').innerText = "🟢 실시간 연결됨"; }});

        // 2. UUID 자동 완성 로직
        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const uuidParam = params.get('uuid');
            if (uuidParam) {
                document.getElementById('uuid_input').value = uuidParam;
            } else {
                try {
                    const text = await navigator.clipboard.readText();
                    if(text.startsWith('orbital-')) document.getElementById('uuid_input').value = text;
                } catch(e) {}
            }
        };

        // 3. 제어 신호 발행 (Publish)
        function sendPowerCommand() {
            const uuid = document.getElementById('uuid_input').value;
            if (!uuid) return alert("UUID를 입력하세요.");
            
            const message = new Paho.MQTT.Message("POWER_ON");
            message.destinationName = "orbital/switch/" + uuid; // 기기별 고유 토픽
            client.send(message);
            alert("전원 신호 송출 완료!");
        }
    </script>
</body>
</html>
